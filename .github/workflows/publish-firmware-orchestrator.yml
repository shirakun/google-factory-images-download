name: Publish Firmware Orchestrator

on:
  push:
    branches:
      - master
    paths:
      - 'FactoryImages.txt'
      - 'FullOTAImages.txt'
  workflow_dispatch:
    inputs:
      device_override:
        description: 'Single device or device:type pair (e.g. "sailfish" or "sailfish:factory"). Empty = full scan of all devices (backfill); ignored on push'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (report only, no downloads/uploads)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: firmware-publisher
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 2 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Build device matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEVICE_OVERRIDE: ${{ inputs.device_override }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$DEVICE_OVERRIDE" ]]; then
              bash .github/scripts/build-device-matrix.sh --device "$DEVICE_OVERRIDE" --github-output
            else
              bash .github/scripts/build-device-matrix.sh --all --github-output
            fi
          else
            bash .github/scripts/build-device-matrix.sh --changed "$BEFORE_SHA" "$AFTER_SHA" --github-output
          fi

  publish-device:
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/publish-firmware.yml
    with:
      device_filter: ${{ matrix.device }}
      type_filter: ${{ matrix.type }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
